# Ingress — nginx ingress controller
#
# ingress-nginx is installed in the ingress-nginx namespace (Helm) and creates
# a Hetzner Cloud Load Balancer with a public IPv4 address. deploy.sh reads that
# address and creates the argocd.container.it-scholar.com A record in Cloudflare.
#
# TLS is terminated by ingress-nginx; the certificate is managed by cert-manager
# via the cluster-issuer annotation (02-certificate.yaml is no longer needed for
# provisioning — cert-manager creates/renews the secret automatically).
#
# ArgoCD server must run in --insecure mode (server.insecure=true in
# argocd-cmd-params-cm) so ingress-nginx can proxy plain HTTP to it.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.container.it-scholar.com
      secretName: argocd-tls
  rules:
    - host: argocd.container.it-scholar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
