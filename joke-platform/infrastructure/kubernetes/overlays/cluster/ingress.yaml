apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: joke-platform
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: joke-platform
    app.kubernetes.io/part-of: joke-platform
spec:
  parentRefs:
  - name: prod-joke-platform-gateway
    namespace: joke-platform
  hostnames:
  - "jokes.container.it-scholar.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: prod-joke-gateway
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: joke-platform-gateway
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: joke-platform
    app.kubernetes.io/part-of: joke-platform
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "jokes.container.it-scholar.com"
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "jokes.container.it-scholar.com"
    tls:
      mode: Terminate
      certificateRefs:
      - name: joke-platform-tls
        kind: Secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: joke-platform-tls
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: joke-platform
    app.kubernetes.io/part-of: joke-platform
spec:
  secretName: joke-platform-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - jokes.container.it-scholar.com
