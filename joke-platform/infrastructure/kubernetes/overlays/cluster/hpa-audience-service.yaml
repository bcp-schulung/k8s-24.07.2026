apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audience-service-hpa
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: audience-service
    app.kubernetes.io/part-of: joke-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audience-service
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
