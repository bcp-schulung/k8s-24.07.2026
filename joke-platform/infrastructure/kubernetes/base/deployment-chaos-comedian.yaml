apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-comedian
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: chaos-comedian
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: joke-platform
    app.kubernetes.io/version: "0.0.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos-comedian
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos-comedian
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: joke-platform
        app.kubernetes.io/version: "0.0.1"
    spec:
      containers:
      - name: chaos-comedian
        image: harbor.container.it-scholar.com/joke-platform/chaos-comedian:0.0.1
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8084
          protocol: TCP
        envFrom:
        - configMapRef:
            name: chaos-comedian-config
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
