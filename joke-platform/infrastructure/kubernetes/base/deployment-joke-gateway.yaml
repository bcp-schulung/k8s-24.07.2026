apiVersion: apps/v1
kind: Deployment
metadata:
  name: joke-gateway
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: joke-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: joke-platform
    app.kubernetes.io/version: "0.0.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: joke-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joke-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: joke-platform
        app.kubernetes.io/version: "0.0.1"
    spec:
      containers:
      - name: joke-gateway
        image: harbor.container.it-scholar.com/joke-platform/joke-gateway:local
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: joke-gateway-config
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
