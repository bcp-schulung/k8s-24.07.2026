apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joke-gateway-netpol
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: joke-gateway
    app.kubernetes.io/part-of: joke-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joke-gateway
      app.kubernetes.io/component: gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow backend services
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: backend
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-services-netpol
  namespace: joke-platform
  labels:
    app.kubernetes.io/part-of: joke-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from gateway
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: joke-gateway
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8084
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow Redis (only for audience-service)
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow RabbitMQ (only for audience-service)
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
  # Allow PostgreSQL (CloudNativePG)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: joke-platform
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: joke-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: datastore
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow only from audience-service
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: audience-service
    ports:
    - protocol: TCP
      port: 6379
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-netpol
  namespace: joke-platform
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: joke-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: messaging
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow only from audience-service
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: audience-service
    ports:
    - protocol: TCP
      port: 5672
  # Allow management UI access from anywhere in cluster
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 15672
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
