{{- if .Values.cnpg.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.clusterName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.cnpg.clusterName }}
    app.kubernetes.io/component: datastore
    app.kubernetes.io/part-of: joke-platform
    helm.sh/chart: {{ include "joke-platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.image.repository }}:{{ .Values.cnpg.image.tag }}
  storage:
    size: {{ .Values.cnpg.persistence.size | quote }}
    {{- if .Values.cnpg.persistence.storageClass }}
    storageClass: {{ .Values.cnpg.persistence.storageClass | quote }}
    {{- end }}
  postgresql:
    pg_hba:
      - hostssl all all all scram-sha-256
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.bootstrap.database | quote }}
      owner: {{ .Values.cnpg.bootstrap.owner | quote }}
      {{- if .Values.cnpg.bootstrap.existingSecret }}
      secret:
        name: {{ .Values.cnpg.bootstrap.existingSecret | quote }}
      {{- end }}
  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
  {{- if .Values.cnpg.affinity.enablePodAntiAffinity }}
  affinity:
    enablePodAntiAffinity: true
  {{- end }}
{{- end }}
