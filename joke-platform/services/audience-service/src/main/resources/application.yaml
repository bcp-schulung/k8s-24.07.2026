spring:
  application:
    name: audience-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:joke-platform}
    username: ${DB_USERNAME:jokes}
    password: ${DB_PASSWORD:jokes-secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: audience_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: audience_service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}
    template:
      retry:
        enabled: false

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

audience-service:
  instance-name: ${HOSTNAME:local}

audience:
  statistics:
    provider: ${AUDIENCE_STATISTICS_PROVIDER:memory}
  events:
    enabled: ${AUDIENCE_EVENTS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: ${AUDIENCE_EVENTS_ENABLED:false}
    redis:
      enabled: ${AUDIENCE_REDIS_HEALTH_ENABLED:false}

info:
  application:
    name: ${spring.application.name}
    description: Generates and records audience reactions
    version: "@project.version@"
