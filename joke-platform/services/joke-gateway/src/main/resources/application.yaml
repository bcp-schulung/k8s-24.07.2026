spring:
  application:
    name: joke-gateway

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

joke-gateway:
  instance-name: ${HOSTNAME:local}

joke-platform:
  http:
    connect-timeout-ms: ${BACKEND_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BACKEND_READ_TIMEOUT_MS:7000}

  services:
    joke-generator:
      base-url: ${JOKE_GENERATOR_URL:http://localhost:8081}

    punchline-service:
      base-url: ${PUNCHLINE_SERVICE_URL:http://localhost:8082}

    audience-service:
      base-url: ${AUDIENCE_SERVICE_URL:http://localhost:8083}

    chaos-comedian:
      base-url: ${CHAOS_COMEDIAN_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Interactive gateway for the Kubernetes joke platform
    version: "@project.version@"
