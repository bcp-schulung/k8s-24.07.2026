spring:
  application:
    name: joke-generator

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:joke-platform}
    username: ${DB_USERNAME:jokes}
    password: ${DB_PASSWORD:jokes-secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: joke_generator

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: joke_generator

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

joke:
  generator:
    repository:
      provider: ${JOKE_GENERATOR_REPOSITORY_PROVIDER:database}

joke-generator:
  instance-name: ${HOSTNAME:local}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Generates joke setups
    version: "@project.version@"
